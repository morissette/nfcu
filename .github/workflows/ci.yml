name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        env:
          PIPENV_PYTHON: python
        run: |
          pip install pipenv
          pipenv install --dev --skip-lock
          pipenv run pip install -e .
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      - name: pylint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPENV_PYTHON: python
        run: |
          pipenv run pylint --output-format=parseable nfcu/ | \
            reviewdog -efm="%f:%l:%c: %t%n: %m" -name=pylint -reporter=github-pr-review -fail-level=error
      - name: pycodestyle
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPENV_PYTHON: python
        run: |
          pipenv run pycodestyle nfcu/ | \
            reviewdog -efm="%f:%l:%c: %t%n %m" -name=pycodestyle -reporter=github-pr-review -fail-level=any

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          PIPENV_PYTHON: python
        run: |
          pip install pipenv
          pipenv install --dev --skip-lock
          pipenv run pip install -e .
      - name: pytest
        run: pipenv run pytest test/ -v
